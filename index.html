/* V2 visual polish: shared spacing, typography, touch and surface rhythm */
:root{--mt-accent:#6945ed;--mt-ink:#1c2941;--mt-muted:#75839a;--mt-hairline:#e9edf5;--mt-radius:22px}
.app{color:var(--mt-ink)}
.sectionhead,.mt-page-title,.mt-insight-head{min-width:0}
.sectionhead h2,.mt-page-title h2,.mt-insight-head h3{letter-spacing:-.35px;line-height:1.25}
.mt-page-title h1{font-weight:830;letter-spacing:-.85px;line-height:1.18}
.mt-page-title button,.sectionhead>button{white-space:nowrap}
.panel,.mt-insight-card{border-radius:var(--mt-radius)}
.mt-insight-card{border:1px solid #edf0f7;padding:19px;box-shadow:0 6px 20px #273e6c08}
.mt-insight-card h3{font-weight:780;line-height:1.3}
.mt-tx-row,.mt-detail-movement,.mt-upcoming-row{min-width:0}
.mt-tx-info b,.mt-tx-info small{overflow-wrap:anywhere}
.mt-tx-right{flex-shrink:0}
.mt-account-card{transition:box-shadow .18s ease,transform .18s ease}
.mt-account-card:active{transform:scale(.992)}
.mt-account-card .mt-account-buttons button{min-height:36px}
button.primary,button.secondary,button.danger{font-weight:730;letter-spacing:-.1px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[role="button"]:focus-visible{outline:2px solid var(--mt-accent);outline-offset:3px}
.nav button:not(.nav-add){display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;line-height:1.15}
.nav button:not(.nav-add) span{display:grid;place-items:center;min-height:22px}
.nav button.active{color:var(--mt-accent);font-weight:790}
.mt-filter-tabs{scrollbar-width:none}
.mt-filter-tabs::-webkit-scrollbar{display:none}
.mt-detail-stats>div,.mt-detail-hero{box-shadow:0 5px 17px #273e6c08}
.mt-account-category>div:first-child span{min-width:0;overflow-wrap:anywhere}
@media(max-width:390px){.panel,.mt-insight-card{padding:16px}.mt-page-title h1{font-size:25px}.mt-page-title h2{font-size:19px}.mt-tx-row{gap:9px}.mt-tx-icon{width:40px;height:40px}}
@media(prefers-reduced-motion:reduce){.mt-account-card{transition:none!important}}

.mt-import-trigger{margin:9px 0 0!important;min-height:43px!important;display:inline-flex!important;align-items:center;justify-content:center}.mt-import-file{display:block;width:100%;margin:8px 0 12px;font-size:13px!important}@media(max-width:649px){.mt-import-trigger{width:100%}} </style></head><body><main class="app"><div class="top"><div><div class="logo">MoneyTrack<span class="brand-dot">.</span></div><div class="muted mini">Il tuo denaro, con chiarezza <span class="mt-version-label">· V2</span></div></div><button type="button" class="top-settings" onclick="setTab('settings')" aria-label="Impostazioni"><span class="mt-settings-glyph" aria-hidden="true">⚙</span></button></div><div id="notice"></div><section id="home"></section><section id="movements" class="hidden"></section><section id="analysis" class="hidden"></section><section id="accounts" class="hidden"></section><section id="accountDetail" class="hidden"></section><section id="savings" class="hidden"></section><section id="settings" class="hidden"></section><section id="calendar" class="hidden"></section><section id="insights" class="hidden"></section></main><div id="mtDirectComposer" class="mt-direct-overlay hidden" role="dialog" aria-modal="true" aria-label="Nuovo movimento"></div><div id="mtPinOverlay" class="mt-pin-overlay hidden"><div class="mt-pin-card"><h2>🔒 MoneyTrack protetto</h2><p>Inserisci il PIN locale per continuare.</p><form id="mtPinForm"><input id="mtPinInput" type="password" inputmode="numeric" required placeholder="PIN"><button class="primary">Sblocca</button></form><small id="mtPinError"></small></div></div><nav class="nav" id="nav"></nav><script>
const CATS=['Casa e bollette','Alimentari e supermercato','Ristoranti e bar','Auto e carburante','Trasporti','Shopping','Salute e benessere','Sport e palestra','Svago e intrattenimento','Abbonamenti','Viaggi e vacanze','Regali','Imposte e commissioni','Altro'];
const DB='moneytrack-official-v2';let db,state,tab='home',editing=null,showComposer=false;const today=()=>new Date().toLocaleDateString('en-CA');const uid=()=>crypto.randomUUID();const euro=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n/100);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const cents=v=>Math.round(Number(String(v).replace(',','.'))*100);const dateFmt=s=>new Date(s+'T12:00:00').toLocaleDateString('it-IT');
function openDB(){return new Promise((res,rej)=>{let q=indexedDB.open(DB,1);q.onupgradeneeded=()=>q.result.createObjectStore('app');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}function getData(){return new Promise((res,rej)=>{let q=db.transaction('app').objectStore('app').get('data');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}function save(){return new Promise((res,rej)=>{let q=db.transaction('app','readwrite').objectStore('app').put(state,'data');q.onsuccess=res;q.onerror=()=>rej(q.error)})}
function init(){return {version:1,accounts:[],transactions:[],recurrences:[],goals:[],categories:[...CATS],lastAccount:null}}const acc=id=>state.accounts.find(x=>x.id===id);function balance(id){return state.accounts.find(x=>x.id===id)?.opening||0}function balanceOf(id){return balance(id)+state.transactions.reduce((n,t)=>n+(t.type==='income'&&t.account===id?t.amount:0)-(t.type==='expense'&&t.account===id?t.amount:0)+(t.type==='transfer'&&t.to===id?t.amount:0)-(t.type==='transfer'&&t.account===id?t.amount:0),0)}const total=()=>state.accounts.filter(a=>!a.archived).reduce((n,a)=>n+balanceOf(a.id),0);function opts(items,val){return items.map(x=>`<option value="${esc(x.id)}" ${x.id===val?'selected':''}>${esc(x.name)}</option>`).join('')}function accountOpts(v){return opts(state.accounts.filter(a=>!a.archived),v)}function categoryOpts(v){return state.categories.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}

pe(this)">+ Entrata</button><button type="button" data-kind="transfer" onclick="mtDirectType(this)">↔ Trasferimento</button><button type="button" data-kind="salary" onclick="mtDirectType(this)">💶 Stipendio</button></div><label>Importo (€)<input name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0,00" required></label><label>Conto<select name="account">'+accountOpts(state.lastAccount||active[0].id)+'</select></label><label id="mtDirectTo" class="hidden">Destinazione<select name="to">'+accountOpts(active[1]?.id||active[0].id)+'</select></label><label id="mtDirectCategory">Categoria<select name="category">'+categoryOpts('Alimentari e supermercato')+'</select></label><label>Data<input name="date" type="date" value="'+today()+'" required></label><label>Descrizione<input name="note" maxlength="140" placeholder="Facoltativa"></label><button class="primary" type="submit">Salva movimento</button></form>':'<p>Per registrare un movimento devi prima creare un conto.</p><button class="primary" onclick="mtCloseDirectComposer();setTab(&quot;settings&quot;)">Crea un conto</button>')+'</div>';root.classList.remove('hidden');document.body.classList.add('mt-direct-open');if(active.length){let form=document.getElementById('mtDirectForm');form.dataset.kind='expense';form.onsubmit=mtSaveDirect;requestAnimationFrame(()=>form.elements.amount.focus({preventScroll:true}))}};
window.mtCloseDirectComposer=function(){document.getElementById('mtDirectComposer')?.classList.add('hidden');document.body.classList.remove('mt-direct-open')};
window.mtDirectType=function(btn){let f=document.getElementById('mtDirectForm'),type=btn.dataset.kind;f.dataset.kind=type;f.querySelectorAll('.mt-direct-types button').forEach(b=>b.classList.toggle('selected',b===btn));document.getElementById('mtDirectTo').classList.toggle('hidden',type!=='transfer');document.getElementById('mtDirectCategory').classList.toggle('hidden',type==='transfer'||type==='salary')};
async function mtSaveDirect(e){e.preventDefault();let f=e.currentTarget,kind=f.dataset.kind,amount=cents(f.elements.amount.value),account=f.elements.account.value,to=f.elements.to.value;if(!Number.isSafeInteger(amount)||amount<=0)return alert('Importo non valido');if(kind==='transfer'&&account===to)return alert('Scegli due conti diversi');let t={id:uid(),created:new Date().toISOString(),type:kind==='salary'?'income':kind,amount,account,to,category:kind==='salary'?'Stipendio':kind==='transfer'?'Trasferimento':f.elements.category.value,date:f.elements.date.value,note:f.elements.note.value.trim(),isSalary:kind==='salary'};let button=f.querySelector('button[type=submit]');button.disabled=true;try{state.transactions.push(t);state.lastAccount=account;await save();mtCloseDirectComposer();showComposer=false;editing=null;render();showToast('Movimento salvato')}catch(err){state.transactions=state.transactions.filter(x=>x.id!==t.id);button.disabled=false;alert('Salvataggio non riuscito: '+err.message)}}
;function mtIcon(name){const paths={home:'<path d="m3 10 9-7 9 7v10h-6v-7H9v7H3z"/>',movements:'<path d="M4 7h16m-4-4 4 4-4 4M20 17H4m4-4-4 4 4 4"/>',accounts:'<rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 10h18M7 15h4"/>',savings:'<path d="M4 11c0-4 3-7 8-7s8 3 8 7v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M8 4V2m8 2V2m-8 11h8"/>',dots:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 10h18"/>',repeat:'<path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4m14-1v2a3 3 0 0 1-3 3H3"/>',shopping:'<path d="M3 4h2l3 12h11l2-9H6M9 21h.01M18 21h.01"/>',car:'<path d="m5 16-1 3v2h3v-2h10v2h3v-2l-1-3-2-7H7zM5 16h14M7 9l2-5h6l2 5"/>',arrowUp:'<path d="m5 17 12-12m-9 0h9v9"/>',arrowDown:'<path d="m5 7 12 12m-9 0h9v-9"/>'};return '<svg class="mt-svg" viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(paths[name]||paths.accounts)+'</svg>'}

function mtPageTransition(id){let el=document.getElementById(id);if(!el)return;let scroller=document.querySelector('.app');if(scroller&&scroller.scrollTop>0)scroller.scrollTo({top:0,behavior:'instant'});if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;if(typeof el.animate==='function')el.animate([{opacity:.65,transform:'translateY(9px)'},{opacity:1,transform:'translateY(0)'}],{duration:220,easing:'cubic-bezier(.2,.8,.2,1)'})}
function mtInstallMobileGestures(){let start=null;document.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;let t=e.target;if(t.closest('input,textarea,select,button,a,[role="button"],.mt-direct-overlay,.composer,.mt-tx-menu'))return;let p=e.touches[0];start={x:p.clientX,y:p.clientY,time:Date.now(),tab:tab}}, {passive:true});document.addEventListener('touchend',e=>{if(!start||!e.changedTouches.length)return;let p=e.changedTouches[0],dx=p.clientX-start.x,dy=p.clientY-start.y,origin=start;start=null;if(origin.tab!=='accountDetail'||tab!=='accountDetail'||origin.x>38||dx<90||Math.abs(dy)>Math.abs(dx)*.7||Date.now()-origin.time>650)return;mtCloseAccountDetail()},{passive:true});document.addEventListener('touchcancel',()=>{start=null},{passive:true})}

function nav(){document.getElementById('nav').innerHTML=[['home','Home'],['movements','Movimenti'],['add',''],['accounts','Conti'],['savings','Risparmio']].map(x=>x[0]==='add'?'<button type="button" class="nav-add" aria-label="Inserisci nuovo movimento" onclick="mtOpenQuickComposer()">+</button>':`<button class="${tab===x[0]?'active':''}" onclick="setTab('${x[0]}')"><span>${mtIcon(x[0])}</span>${x[1]}</button>`).join('')}
function showToast(message){let n=document.getElementById('notice');n.innerHTML='<div class="toast">✓ '+esc(message)+'</div>';setTimeout(()=>{if(n)n.innerHTML=''},2800)}function render(){document.body.classList.toggle('composer-open',tab==='movements'&&(showComposer||!!editing));nav();for(let id of ['home','movements','analysis','accounts','savings','settings','calendar','insights','accountDetail']){let el=document.getElementById(id);if(el)el.classList.toggle('hidden',id!==tab)}try{({home:home,movements:movements,analysis:analysis,accounts:accountsPage,savings:savings,settings:settings,calendar:mtCalendar,insights:mtInsights,accountDetail:mtAccountDetail})[tab]()}catch(err){console.error('MoneyTrack rendering '+tab,err);let el=document.getElementById(tab);if(el)el.innerHTML='<div class="panel"><h2>Problema nella sezione</h2><p>'+esc(err.message)+'</p><button class="primary" onclick="setTab(\'home\')">Torna alla Home</button></div>';showToast('Errore in '+tab)}}function monthStats(){let m=today().slice(0,7);return state.transactions.filter(t=>t.date.slice(0,7)===m).reduce((o,t)=>{if(t.type==='income')o.inc+=t.amount;if(t.type==='expense')o.exp+=t.amount;return o},{inc:0,exp:0})}function txRow(t){let sign=t.type==='expense'?'−':t.type==='income'?'+':'↔',cl=t.type==='expense'?'negative':t.type==='income'?'positive':'',cat=t.category||'Trasferimento',ic=t.type==='income'?'arrowUp':t.type==='transfer'?'repeat':/auto|carburante|trasport/i.test(cat)?'car':/aliment|supermercat|spesa/i.test(cat)?'shopping':'accounts';return `<div class="mt-tx-row"><span class="mt-tx-icon ${t.type}">${mtIcon(ic)}</span><div class="mt-tx-info"><b>${esc(t.note||cat)}</b><small>${esc(cat)} · ${esc(acc(t.account)?.name||'Conto eliminato')}</small></div><div class="mt-tx-right"><b class="${cl}">${sign} ${euro(t.amount)}</b><details class="mt-tx-menu"><summary aria-label="Opzioni movimento">${mtIcon('dots')}</summary><div class="mt-tx-menu-actions"><button onclick="editTx('${t.id}')">Modifica</button><button onclick="deleteTx('${t.id}')">Elimina</button></div></details></div></div>`}
function sortedTx(){return [...state.transactions].sort((a,b)=>b.date.localeCompare(a.date)||b.created.localeCompare(a.created))}
let homePeriod='salary',homeCustomStart='',homeCustomEnd='',homePeriodOpen=false,homePeriodDraft='salary';

function mtBalance(n){return document.body.classList.contains('mt-hide-balances')?'••••••':euro(n)}function toggleHomeBalance(){document.body.classList.toggle('mt-hide-balances');try{localStorage.setItem('moneytrack-v2-hide-balances',document.body.classList.contains('mt-hide-balances')?'1':'0')}catch(e){console.warn('Privacy preference not saved',e)}render()}
function isSalary(t){return t.type==='income'&&(t.isSalary===true||/stipendio|salario|busta paga|payroll/i.test((t.note||'')+' '+(t.category||'')))}
function home(){let accounts=state.accounts.filter(a=>!a.archived),main=accounts.find(a=>/principale/i.test(a.name))||accounts[0],salary=sortedTx().find(t=>isSalary(t)&&t.date<=today()),now=new Date(),month=today().slice(0,7),start=homePeriod==='salary'&&salary?salary.date:month+'-01',end=today();if(homePeriod==='three'||homePeriod==='six'||homePeriod==='year'){let d=new Date(now.getFullYear(),now.getMonth()-(homePeriod==='three'?2:homePeriod==='six'?5:11),1);start=d.toLocaleDateString('en-CA')}if(homePeriod==='custom'){start=homeCustomStart||month+'-01';end=homeCustomEnd||today()}let transactions=state.transactions.filter(t=>t.date>=start&&t.date<=end),expenses=transactions.filter(t=>t.type==='expense'),income=transactions.filter(t=>t.type==='income'),sum=expenses.reduce((n,t)=>n+t.amount,0),inc=income.reduce((n,t)=>n+t.amount,0),groups={};for(let t of expenses){let c=t.category||'Altro';groups[c]=(groups[c]||0)+t.amount}let entries=Object.entries(groups).sort((a,b)=>b[1]-a[1]),colors=['#5934f5','#36c6f2','#05b98d','#ff875e','#ffce14','#ff7f97','#a48bf5','#6898ed'],angle=0,segments=entries.map(([name,value],i)=>{let from=angle;angle+=sum?value/sum*360:0;return colors[i%colors.length]+' '+from+'deg '+angle+'deg'}).join(','),labels={salary:'Ultimo stipendio',month:'Mese corrente',three:'Ultimi 3 mesi',six:'Ultimi 6 mesi',year:'Ultimo anno',custom:'Personalizzato'},mainName=main?esc(main.name):'Nessun conto',money=main?mtBalance(balanceOf(main.id)):mtBalance(0);
document.getElementById('home').innerHTML=`<div class="mt-account"><div class="mt-account-top"><span>Conto principale</span></div><div class="mt-account-balance"><span class="mt-balance-value">${money}</span><button class="mt-eye" onclick="toggleHomeBalance()" aria-label="Mostra o nascondi tutti i saldi e i risparmi">◉</button></div><div class="mt-account-name">${mainName}</div></div>${mtBudgetCard()}${mtUpcomingCard()}${mtFixedCosts()}${mtWealthChart()}<div class="mt-stats"><div class="mt-stat mt-income"><span class="mt-stat-icon">↗</span><span>Entrate<strong>+ ${euro(inc)}</strong></span></div><div class="mt-stat mt-expense"><span class="mt-stat-icon">↘</span><span>Uscite<strong>− ${euro(sum)}</strong></span></div></div><div class="mt-chart-card"><div class="mt-chart-head"><h2>Dove sono andati i soldi</h2><button class="mt-period-btn" onclick="openHomePeriod()">${labels[homePeriod]}⌄</button></div><div class="mt-period-note">${homePeriod==='salary'&&!salary?'Nessuno stipendio riconosciuto · ':''}${dateFmt(start)} – ${dateFmt(end)}</div><div class="mt-chart-body"><div class="mt-ring" style="background:${sum?'conic-gradient('+segments+')':'#e9ebf3'}"><div class="mt-ring-inner"><span>Totale spese</span><strong>${euro(sum)}</strong></div></div><div class="mt-legend">${entries.map(([name,value],i)=>`<div class="mt-legend-item"><i style="background:${colors[i%colors.length]}"></i><span>${esc(name)}</span><b>${euro(value)}</b></div>`).join('')||'<div class="empty">Nessuna spesa nel periodo.</div>'}</div></div></div>${mtSalaryHistory()}<div class="mt-accounts-title"><h2>I tuoi conti</h2><button onclick="setTab('accounts')">Vedi tutti</button></div><div class="mt-account-cards">${accounts.slice(0,4).map((a,i)=>mtAccountCard(a,i)).join('')||'<div class="empty">Aggiungi un conto dalle impostazioni.</div>'}</div>${homePeriodOpen?`<div class="mt-modal-backdrop" onclick="closeHomePeriod()"></div><div class="mt-modal" role="dialog" aria-modal="true" aria-label="Seleziona periodo function settings(){document.getElementById('settings').innerHTML=`<h2>Conti e impostazioni</h2><div class="mt-insight-card"><h3>Strumenti e privacy</h3><div class="mt-tools"><button onclick="${state.mtPin?'mtDisablePin()':'mtEnablePin()'}">${state.mtPin?'Disattiva PIN':'Attiva PIN locale'}</button><button onclick="mtLockNow()" ${state.mtPin?'':'disabled'}>🔒 Blocca ora</button><button onclick="setTab(&quot;calendar&quot;)">🗓️ Calendario finanziario</button><button onclick="setTab(&quot;insights&quot;)">📊 Analisi automatiche</button><button onclick="toggleHomeBalance()">👁️ Mostra/nascondi saldo</button></div><p class="muted mini">I dati restano locali. Il backup JSON non è cifrato: custodiscilo in un luogo sicuro.</p></div>${mtBackupPanel()}${mtCategoryBudgets()}<div class="panel"><h2>Nuovo conto</h2><form id="accountForm"><div class="grid"><div><label>Nome</label><input name="name" required maxlength="60" placeholder="Conto principale"></div><div><label>Tipologia</label><select name="type"><option>Conto corrente</option><option>Contanti</option><option>Risparmio</option><option>Carta prepagata</option><option>Altro</option></select></div><div class="wide"><label>Saldo iniziale (€)</label><input name="opening" type="number" step="0.01" value="0" required></div></div><button class="primary">+ Aggiungi conto</button></form><div class="sectionhead"><h2>Conti esistenti</h2></div>${state.accounts.map(a=>`<div class="item"><div><b>${esc(a.name)}</b><small>${esc(a.type)} · ${a.archived?'Archiviato':'Attivo'}</small></div><div class="right"><b>${euro(balanceOf(a.id))}</b><div class="actions"><button class="secondary" onclick="mtCustomizeAccount('${a.id}')">🎨 Personalizza</button><button class="secondary" onclick="mtEditOpening('${a.id}')">Saldo iniziale</button><button class="secondary" onclick="renameAccount('${a.id}')">Rinomina</button><button class="secondary" onclick="archiveAccount('${a.id}')">${a.archived?'Riattiva':'Archivia'}</button></div></div></div>`).join('')}</div><div class="panel"><h2>Movimenti ricorrenti</h2><p class="muted mini">Generazione automatica all'apertura dell'app per tutte le scadenze maturate. Puoi interrompere una ricorrenza in qualsiasi momento.</p><form id="recForm"><div class="grid"><div><label>Descrizione</label><input name="name" required placeholder="Es. Abbonamento"></div><div><label>Importo (€)</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div><label>Tipo</label><select name="type"><option value="expense">Spesa</option><option value="income">Entrata</option></select></div><div><label>Frequenza</label><select name="frequency"><option value="monthly">Mensile</option><option value="weekly">Settimanale</option><option value="yearly">Annuale</option><option value="daily">Giornaliera</option></select></div><div><label>Conto</label><select name="account">${accountOpts(state.accounts.find(a=>!a.archived)?.id)}</select></div><div><label>Categoria</label><select name="category">${categoryOpts('Abbonamenti')}</select></div><div><label>Prima scadenza</label><input name="next" type="date" value="${today()}" required></div></div><button class="primary" ${state.accounts.filter(a=>!a.archived).length?'':'disabled'}>+ Aggiungi ricorrenza</button></form>${state.recurrences.map(r=>`<div class="item"><div><b>${esc(r.name)}</b><small>${esc(r.frequency)} · prossima ${dateFmt(r.next)} · ${esc(acc(r.account)?.name||'')}</small></div><div class="right"><b>${euro(r.amount)}</b><div class="actions"><button class="danger" onclick="delRec('${r.id}')">Interrompi</button></div></div></div>`).join('')}</div><div class="panel"><h2>Backup e ripristino</h2><p class="muted mini">I dati restano in questo browser. Esporta periodicamente un backup JSON e conservalo in modo sicuro: non è cifrato.</p><button class="primary" onclick="backup()">↓ Esporta backup JSON</button> <button class="secondary" onclick="csv()">↓ Esporta CSV</button><label>Ripristina da backup JSON (sostituisce tutti i dati)</label><input type="file" accept="application/json,.json" id="restore" class="mt-import-file" aria-label="Seleziona backup JSON"><p class="muted mini">Il ripristino richiede conferma. Non è possibile annullarlo senza un backup precedente.</p></div>`;document.getElementById('accountForm').onsubmit=async e=>{e.preventDefault();let f=e.target,n=cents(f.elements.opening.value);if(!Number.isSafeInteger(n))return;state.accounts.push({id:uid(),name:f.elements.name.value.trim(),type:f.elements.type.value,opening:n,archived:false});await save();render()};document.getElementById('recForm').onsubmit=async e=>{e.preventDefault();let f=e.target,n=cents(f.elements.amount.value);if(n<=0||!Number.isSafeInteger(n))return;state.recurrences.push({id:uid(),name:f.elements.name.value.trim(),amount:n,type:f.elements.type.value,frequency:f.elements.frequency.value,account:f.elements.account.value,category:f.elements.category.value,next:f.elements.next.value,anchorDay:Number(f.elements.next.value.slice(8,10)),anchorMonth:Number(f.elements.next.value.slice(5,7))});await processRecurring();render()};document.getElementById('restore').onchange=restore}
window.renameAccount=async id=>{let a=acc(id),n=prompt('Nome del conto',a.name);if(n?.trim()){a.name=n.trim();await save();render()}};window.deleteAccount=async id=>{let a=acc(id);if(!a)return;let linked=state.transactions.some(t=>t.account===id||t.to===id)||state.recurrences.some(r=>r.account===id||r.to===id);if(linked){alert('Questo conto ha movimenti collegati. Per non perdere lo storico, puoi archiviarlo nelle impostazioni.');return}if(!confirm('Eliminare definitivamente il conto '+a.name+'?'))return;state.accounts=state.accounts.filter(x=>x.id!==id);if(state.lastAccount===id)state.lastAccount=state.accounts.find(x=>!x.archived)?.id||null;await save();render();showToast('Conto eliminato')};window.archiveAccount=async id=>{let a=acc(id);a.archived=!a.archived;await save();render()};window.delRec=async id=>{if(confirm('Interrompere questa ricorrenza? I movimenti già registrati resteranno.')){state.recurrences=state.recurrences.filter(r=>r.id!==id);await save();render()}};
function nextDate(r){let [y,m,d]=r.next.split('-').map(Number),dt=new Date(Date.UTC(y,m-1,d));if(r.frequency==='daily')dt.setUTCDate(dt.getUTCDate()+1);if(r.frequency==='weekly')dt.setUTCDate(dt.getUTCDate()+7);if(r.frequency==='monthly'){let mm=m+1,yy=y;if(mm>12){mm=1;yy++}let last=new Date(Date.UTC(yy,mm,0)).getUTCDate();dt=new Date(Date.UTC(yy,mm-1,Math.min(r.anchorDay||d,last)))}if(r.frequency==='yearly'){let yy=y+1,mm=r.anchorMonth||m,last=new Date(Date.UTC(yy,mm,0)).getUTCDate();dt=new Date(Date.UTC(yy,mm-1,Math.min(r.anchorDay||d,last)))}return dt.toISOString().slice(0,10)}async function processRecurring(){let changed=false,limit=0;for(let r of state.recurrences){while(r.next<=today()&&limit<10000){if(!state.transactions.some(t=>t.recurrence===r.id&&t.date===r.next)){state.transactions.push({id:uid(),created:new Date().toISOString(),type:r.type,amount:r.amount,account:r.account,category:r.category,note:r.name,date:r.next,recurrence:r.id});changed=true}r.next=nextDate(r);changed=true;limit++}}if(changed)await save();if(limit>=10000)document.getElementById('notice').innerHTML='<div class="notice">Troppe scadenze arretrate: alcune ricorrenze richiedono una verifica.</div>'}
function download(name,body,type){let url=URL.createObjectURL(new Blob([body],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}window.backup=()=>{download('moneytrack-backup-'+today()+'.json',JSON.stringify(state,null,2),'application/json');try{localStorage.setItem('moneytrack-v2-last-backup',new Date().toISOString())}catch(e){}if(tab==='settings')render()};window.csv=()=>{let rows=[['Data','Tipo','Importo EUR','Conto','Destinazione','Categoria','Descrizione'],...sortedTx().map(t=>[t.date,t.type,(t.amount/100).toFixed(2),acc(t.account)?.name||'',acc(t.to)?.name||'',t.category,t.note])];download('moneytrack-movimenti-'+today()+'.csv','\ufeff'+rows.map(row=>row.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8')};async function restore(e){let file=e.target.files[0];if(!file)return;try{let data=JSON.parse(await file.text());if(data.version!==1||!Array.isArray(data.accounts)||!Array.isArray(data.transactions)||!Array.isArray(data.recurrences)||!Array.isArray(data.goals)||!Array.isArray(data.categories))throw Error('Formato backup non valido');if(!confirm('ATTENZIONE: il backup sostituirà tutti i conti e movimenti attuali. Vuoi continuare?'))return;let previous=state;try{state=data;await save();await processRecurring();render();alert('Backup importato correttamente')}catch(saveError){state=previous;throw saveError}}catch(err){alert('Ripristino non riuscito: '+err.message)}finally{e.target.value=''}}
(async()=>{try{mtInstallMobileGestures();db=await openDB();let previewData=await getData();state=previewData||init();try{document.body.classList.toggle('mt-hide-balances',localStorage.getItem('moneytrack-v2-hide-balances')==='1')}catch(e){}state.accounts??=[];state.transactions??=[];state.recurrences??=[];state.goals??=[];state.categories??=[...CATS];await processRecurring();render();document.getElementById('mtPinForm').onsubmit=mtUnlockPin;if(state.mtPin)mtLockNow()}catch(e){document.querySelector('.app').innerHTML='<div class="panel">Impossibile aprire il database locale. Controlla che il browser consenta IndexedDB.</div>';console.error(e)}})();
</script></body></html>
