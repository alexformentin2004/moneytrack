</style></head><body><main class="app"><div class="top"><div><div class="logo">MoneyTrack<span class="brand-dot">.</span></div><div class="muted mini">Il tuo denaro, con chiarezza</div></div><button class="top-settings" onclick="setTab('settings')" aria-label="Impostazioni">⚙</button></div><div id="notice"></div><section id="home"></section><section id="movements" class="hidden"></section><section id="analysis" class="hidden"></section><section id="savings" class="hidden"></section><section id="settings" class="hidden"></section></main><nav class="nav" id="nav"></nav><script>
const CATS=['Casa e bollette','Alimentari e supermercato','Ristoranti e bar','Auto e carburante','Trasporti','Shopping','Salute e benessere','Sport e palestra','Svago e intrattenimento','Abbonamenti','Viaggi e vacanze','Regali','Imposte e commissioni','Altro'];
const DB='moneytrack-v1';let db,state,tab='home',editing=null,showComposer=false;const today=()=>new Date().toLocaleDateString('en-CA');const uid=()=>crypto.randomUUID();const euro=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n/100);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const cents=v=>Math.round(Number(String(v).replace(',','.'))*100);const dateFmt=s=>new Date(s+'T12:00:00').toLocaleDateString('it-IT');
function openDB(){return new Promise((res,rej)=>{let q=indexedDB.open(DB,1);q.onupgradeneeded=()=>q.result.createObjectStore('app');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}function getData(){return new Promise((res,rej)=>{let q=db.transaction('app').objectStore('app').get('data');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}function save(){return new Promise((res,rej)=>{let q=db.transaction('app','readwrite').objectStore('app').put(state,'data');q.onsuccess=res;q.onerror=()=>rej(q.error)})}
function init(){return {version:1,accounts:[],transactions:[],recurrences:[],goals:[],categories:[...CATS],lastAccount:null}}const acc=id=>state.accounts.find(x=>x.id===id);function balance(id){return state.accounts.find(x=>x.id===id)?.opening||0}function balanceOf(id){return balance(id)+state.transactions.reduce((n,t)=>n+(t.type==='income'&&t.account===id?t.amount:0)-(t.type==='expense'&&t.account===id?t.amount:0)+(t.type==='transfer'&&t.to===id?t.amount:0)-(t.type==='transfer'&&t.account===id?t.amount:0),0)}const total=()=>state.accounts.filter(a=>!a.archived).reduce((n,a)=>n+balanceOf(a.id),0);function opts(items,val){return items.map(x=>`<option value="${esc(x.id)}" ${x.id===val?'selected':''}>${esc(x.name)}</option>`).join('')}function accountOpts(v){return opts(state.accounts.filter(a=>!a.archived),v)}function categoryOpts(v){return state.categories.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}
function setTab(t){tab=t;editing=null;showComposer=false;render()}function quickAdd(){tab='movements';editing=null;showComposer=true;render();requestAnimationFrame(()=>{document.getElementById('txform')?.elements.amount?.focus();void 0})}window.quickAdd=quickAdd;window.setTab=setTab;function nav(){document.getElementById('nav').innerHTML=[['home','⌂','Home'],['movements','⇄','Movimenti'],['add','+',''],['analysis','▥','Analisi'],['savings','◇','Risparmi']].map(x=>x[0]==='add'?`<button class="nav-add" aria-label="Aggiungi movimento" onclick="quickAdd()">+</button>`:`<button class="${tab===x[0]?'active':''}" onclick="setTab('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}
function showToast(message){let n=document.getElementById('notice');n.innerHTML='<div class="toast">✓ '+esc(message)+'</div>';setTimeout(()=>{if(n)n.innerHTML=''},2800)}function render(){document.body.classList.toggle('composer-open',tab==='movements'&&(showComposer||!!editing));nav();for(let id of ['home','movements','analysis','savings','settings'])document.getElementById(id).classList.toggle('hidden',id!==tab);({home:home,movements:movements,analysis:analysis,savings:savings,settings:settings})[tab]()}function monthStats(){let m=today().slice(0,7);return state.transactions.filter(t=>t.date.slice(0,7)===m).reduce((o,t)=>{if(t.type==='income')o.inc+=t.amount;if(t.type==='expense')o.exp+=t.amount;return o},{inc:0,exp:0})}function txRow(t){let sign=t.type==='expense'?'-':t.type==='income'?'+':'↔',cl=t.type==='expense'?'negative':t.type==='income'?'positive':'';return `<div class="item"><div><b>${esc(t.note||t.category||'Trasferimento')}</b><small>${dateFmt(t.date)} · ${esc(acc(t.account)?.name||'Conto eliminato')}${t.type==='transfer'?' → '+esc(acc(t.to)?.name||'Conto eliminato'):''} · ${esc(t.category||'Trasferimento')}</small></div><div class="right"><b class="${cl}">${sign} ${euro(t.amount)}</b><div class="actions"><button class="secondary" onclick="editTx('${t.id}')">Modifica</button><button class="danger" onclick="deleteTx('${t.id}')">Elimina</button></div></div></div>`}function sortedTx(){return [...state.transactions].sort((a,b)=>b.date.localeCompare(a.date)||b.created.localeCompare(a.created))}
function home(){let s=monthStats();document.getElementById('home').innerHTML=`<div class="panel hero"><div class="eyebrow muted">Patrimonio complessivo</div><div class="amount">${euro(total())}</div><div class="grid"><div class="stat"><span class="muted mini">Entrate del mese</span><b class="positive">${euro(s.inc)}</b></div><div class="stat"><span class="muted mini">Uscite del mese</span><b class="negative">${euro(s.exp)}</b></div></div><p class="muted mini">Bilancio del mese: <b>${euro(s.inc-s.exp)}</b></p></div><div class="two"><div class="panel"><div class="sectionhead"><h2>I tuoi conti</h2><button class="secondary" onclick="setTab('settings')">Gestisci</button></div>${state.accounts.filter(a=>!a.archived).map(a=>`<div class="item"><div><b>${esc(a.name)}</b><small>${esc(a.type)}</small></div><b>${euro(balanceOf(a.id))}</b></div>`).join('')||'<div class="empty">Inizia creando il tuo primo conto dalle impostazioni.</div>'}</div><div class="panel"><div class="sectionhead"><h2>Ultimi movimenti</h2><button class="secondary" onclick="setTab('movements')">Vedi tutti</button></div>${sortedTx().slice(0,5).map(txRow).join('')||'<div class="empty">Nessun movimento ancora.</div>'}</div></div><button class="primary home-add" onclick="quickAdd()">+ Aggiungi un movimento</button>`}
function movements(){let a=state.accounts.filter(x=>!x.archived);document.getElementById('movements').innerHTML=`<div class="sectionhead"><h2>Movimenti</h2><button class="primary" onclick="quickAdd()">+ Nuovo</button></div>${!a.length?'<div class="notice">Prima crea un conto nella sezione Altro.</div>':`<div class="composer-backdrop ${showComposer||editing?'':'hidden'}" onclick="closeComposer()"></div><div role="dialog" aria-modal="true" aria-label="Nuovo movimento" class="panel composer ${showComposer||editing?'sheet-open':'hidden'}" id="composer"><div class="sectionhead"><h2>${editing?'Modifica movimento':'Nuovo movimento'}</h2><button class="secondary" onclick="closeComposer()">Chiudi ×</button></div><form id="txform"><div class="grid"><div><label>Tipo</label><select name="type" id="txType"><option value="expense">Spesa</option><option value="income">Entrata</option><option value="transfer">Trasferimento</option></select></div><div><label>Importo (€)</label><input name="amount" inputmode="decimal" type="number" min="0.01" step="0.01" required placeholder="0,00"></div><div><label>Conto</label><select name="account">${accountOpts(state.lastAccount||a[0].id)}</select></div><div id="toWrap" class="hidden"><label>Destinazione</label><select name="to">${accountOpts(a[1]?.id||a[0].id)}</select></div><div id="catWrap"><label>Categoria</label><select name="category">${categoryOpts('Alimentari e supermercato')}</select></div><div><label>Data</label><input name="date" type="date" value="${today()}" required></div><div class="wide"><label>Descrizione (facoltativa)</label><input name="note" maxlength="140" placeholder="Es. Spesa supermercato"></div></div><button class="primary" type="submit">${editing?'Salva modifiche':'Registra movimento'}</button> ${editing?'<button class="secondary" type="button" onclick="cancelEdit()">Annulla</button>':''}</form></div>`}<div class="sectionhead"><h2>Storico movimenti</h2><span class="pill">${state.transactions.length} totali</span></div><div class="panel"><div class="filter"><input id="txSearch" placeholder="Cerca descrizione o categoria" aria-label="Cerca movimenti"><select id="txFilter"><option value="all">Tutti i tipi</option><option value="expense">Spese</option><option value="income">Entrate</option><option value="transfer">Trasferimenti</option></select></div><div id="txList"></div></div>`;if(a.length){let f=document.getElementById('txform');f.elements.type.onchange=()=>{document.getElementById('toWrap').classList.toggle('hidden',f.elements.type.value!=='transfer');document.getElementById('catWrap').classList.toggle('hidden',f.elements.type.value==='transfer')};f.onsubmit=saveTx;if(editing){let t=state.transactions.find(t=>t.id===editing);if(t){for(let k of ['type','account','to','category','date','note'])if(f.elements[k]&&t[k]!=null)f.elements[k].value=t[k];f.elements.amount.value=(t.amount/100).toFixed(2);f.elements.type.onchange()}}}document.getElementById('txSearch').oninput=drawTx;document.getElementById('txFilter').onchange=drawTx;drawTx()}
function drawTx(){let q=document.getElementById('txSearch').value.toLowerCase(),f=document.getElementById('txFilter').value;let t=sortedTx().filter(x=>(f==='all'||x.type===f)&&(x.note+' '+x.category+' '+(acc(x.account)?.name||'')).toLowerCase().includes(q));document.getElementById('txList').innerHTML=t.map(txRow).join('')||'<div class="empty">Nessun movimento trovato.</div>'}async function saveTx(e){e.preventDefault();let f=e.target,t={id:editing||uid(),created:editing?state.transactions.find(x=>x.id===editing).created:new Date().toISOString(),type:f.elements.type.value,amount:cents(f.elements.amount.value),account:f.elements.account.value,to:f.elements.to.value,category:f.elements.type.value==='transfer'?'Trasferimento':f.elements.category.value,date:f.elements.date.value,note:f.elements.note.value.trim()};if(!Number.isSafeInteger(t.amount)||t.amount<=0)return alert('Inserisci un importo valido.');if(t.type==='transfer'&&t.account===t.to)return alert('Seleziona due conti diversi.');if(editing)state.transactions=state.transactions.map(x=>x.id===editing?t:x);else state.transactions.push(t);state.lastAccount=t.account;editing=null;showComposer=false;await save();render();showToast('Movimento salvato')}window.editTx=id=>{editing=id;showComposer=true;tab='movements';render();scrollTo(0,0)};window.cancelEdit=()=>{editing=null;showComposer=false;render()};window.closeComposer=()=>{editing=null;showComposer=false;render()};window.deleteTx=async id=>{if(!confirm('Eliminare questo movimento?'))return;state.transactions=state.transactions.filter(t=>t.id!==id);await save();render()};
function analysis(){let s=monthStats(),by={};for(let t of state.transactions.filter(t=>t.type==='expense'&&t.date.slice(0,7)===today().slice(0,7)))by[t.category]=(by[t.category]||0)+t.amount;let list=Object.entries(by).sort((a,b)=>b[1]-a[1]);document.getElementById('analysis').innerHTML=`<h2>Analisi del mese</h2><div class="grid"><div class="panel"><span class="muted">Entrate</span><div class="amount positive" style="font-size:27px">${euro(s.inc)}</div></div><div class="panel"><span class="muted">Spese</span><div class="amount negative" style="font-size:27px">${euro(s.exp)}</div></div></div><div class="panel"><div class="sectionhead"><h2>Bilancio netto</h2><b>${euro(s.inc-s.exp)}</b></div><p class="muted mini">Entrate meno spese; i trasferimenti tra conti non sono conteggiati.</p></div><div class="panel"><h2>Spese per categoria</h2>${list.map(([name,n])=>`<div class="item"><div style="width:100%"><div class="sectionhead"><span>${esc(name)}</span><b>${euro(n)}</b></div><div class="bar"><div style="width:${s.exp?100*n/s.exp:0}%"></div></div></div></div>`).join('')||'<div class="empty">Nessuna spesa questo mese.</div>'}</div><div class="panel"><h2>Ultimi 6 mesi</h2>${Array.from({length:6},(_,i)=>{let d=new Date();d.setDate(1);d.setMonth(d.getMonth()-(5-i));let key=d.toLocaleDateString('en-CA').slice(0,7),ts=state.transactions.filter(t=>t.date.slice(0,7)===key),inc=ts.filter(t=>t.type==='income').reduce((n,t)=>n+t.amount,0),exp=ts.filter(t=>t.type==='expense').reduce((n,t)=>n+t.amount,0);return `<div class="item"><span>${d.toLocaleDateString('it-IT',{month:'short',year:'numeric'})}</span><span class="mini positive">+${euro(inc)}</span><span class="mini negative">-${euro(exp)}</span><b>${euro(inc-exp)}</b></div>`}).join('')}</div>`}
function savings(){document.getElementById('savings').innerHTML=`<h2>Obiettivi di risparmio</h2><div class="notice">Gli obiettivi sono promemoria: il denaro resta contabilizzato nei conti, evitando doppi conteggi.</div><div class="panel"><form id="goalForm"><label>Nome obiettivo</label><input name="name" required maxlength="70" placeholder="Es. Fondo emergenze"><div class="grid"><div><label>Importo obiettivo (€)</label><input name="target" type="number" step="0.01" min="0.01" required></div><div><label>Importo già accantonato (€)</label><input name="saved" type="number" step="0.01" min="0" value="0" required></div></div><button class="primary">+ Crea obiettivo</button></form></div><div class="panel">${state.goals.map(g=>`<div class="item"><div style="flex:1"><b>${esc(g.name)}</b><small>${euro(g.saved)} di ${euro(g.target)} · ${Math.min(100,Math.round(100*g.saved/g.target))}%</small><div class="bar"><div style="width:${Math.min(100,100*g.saved/g.target)}%"></div></div><div class="actions" style="justify-content:flex-start"><button class="secondary" onclick="addGoal('${g.id}')">Aggiorna importo</button><button class="danger" onclick="delGoal('${g.id}')">Elimina</button></div></div></div>`).join('')||'<div class="empty">Crea il tuo primo obiettivo.</div>'}</div>`;document.getElementById('goalForm').onsubmit=async e=>{e.preventDefault();let f=e.target,t=cents(f.elements.target.value),s=cents(f.elements.saved.value);if(t<=0||s<0)return;state.goals.push({id:uid(),name:f.elements.name.value.trim(),target:t,saved:s});await save();render()}}window.addGoal=async id=>{let g=state.goals.find(x=>x.id===id),v=prompt('Nuovo importo accantonato (€)',(g.saved/100).toFixed(2));if(v===null)return;let n=cents(v);if(!Number.isSafeInteger(n)||n<0)return alert('Importo non valido');g.saved=n;await save();render()};window.delGoal=async id=>{if(confirm('Eliminare obiettivo?')){state.goals=state.goals.filter(x=>x.id!==id);await save();render()}};
function settings(){document.getElementById('settings').innerHTML=`<h2>Conti e impostazioni</h2><div class="panel"><h2>Nuovo conto</h2><form id="accountForm"><div class="grid"><div><label>Nome</label><input name="name" required maxlength="60" placeholder="Conto principale"></div><div><label>Tipologia</label><select name="type"><option>Conto corrente</option><option>Contanti</option><option>Risparmio</option><option>Carta prepagata</option><option>Altro</option></select></div><div class="wide"><label>Saldo iniziale (€)</label><input name="opening" type="number" step="0.01" value="0" required></div></div><button class="primary">+ Aggiungi conto</button></form><div class="sectionhead"><h2>Conti esistenti</h2></div>${state.accounts.map(a=>`<div class="item"><div><b>${esc(a.name)}</b><small>${esc(a.type)} · ${a.archived?'Archiviato':'Attivo'}</small></div><div class="right"><b>${euro(balanceOf(a.id))}</b><div class="actions"><button class="secondary" onclick="renameAccount('${a.id}')">Rinomina</button><button class="secondary" onclick="archiveAccount('${a.id}')">${a.archived?'Riattiva':'Archivia'}</button></div></div></div>`).join('')}</div><div class="panel"><h2>Movimenti ricorrenti</h2><p class="muted mini">Generazione automatica all'apertura dell'app per tutte le scadenze maturate. Puoi interrompere una ricorrenza in qualsiasi momento.</p><form id="recForm"><div class="grid"><div><label>Descrizione</label><input name="name" required placeholder="Es. Abbonamento"></div><div><label>Importo (€)</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div><label>Tipo</label><select name="type"><option value="expense">Spesa</option><option value="income">Entrata</option></select></div><div><label>Frequenza</label><select name="frequency"><option value="monthly">Mensile</option><option value="weekly">Settimanale</option><option value="yearly">Annuale</option><option value="daily">Giornaliera</option></select></div><div><label>Conto</label><select name="account">${accountOpts(state.accounts.find(a=>!a.archived)?.id)}</select></div><div><label>Categoria</label><select name="category">${categoryOpts('Abbonamenti')}</select></div><div><label>Prima scadenza</label><input name="next" type="date" value="${today()}" required></div></div><button class="primary" ${state.accounts.filter(a=>!a.archived).length?'':'disabled'}>+ Aggiungi ricorrenza</button></form>${state.recurrences.map(r=>`<div class="item"><div><b>${esc(r.name)}</b><small>${esc(r.frequency)} · prossima ${dateFmt(r.next)} · ${esc(acc(r.account)?.name||'')}</small></div><div class="right"><b>${euro(r.amount)}</b><div class="actions"><button class="danger" onclick="delRec('${r.id}')">Interrompi</button></div></div></div>`).join('')}</div><div class="panel"><h2>Backup e ripristino</h2><p class="muted mini">I dati restano in questo browser. Esporta periodicamente un backup JSON e conservalo in modo sicuro: non è cifrato.</p><button class="primary" onclick="backup()">↓ Esporta backup JSON</button> <button class="secondary" onclick="csv()">↓ Esporta CSV</button><label>Ripristina da backup JSON (sostituisce tutti i dati)</label><input type="file" accept="application/json,.json" id="restore"><p class="muted mini">Il ripristino richiede conferma. Non è possibile annullarlo senza un backup precedente.</p></div>`;document.getElementById('accountForm').onsubmit=async e=>{e.preventDefault();let f=e.target,n=cents(f.elements.opening.value);if(!Number.isSafeInteger(n))return;state.accounts.push({id:uid(),name:f.elements.name.value.trim(),type:f.elements.type.value,opening:n,archived:false});await save();render()};document.getElementById('recForm').onsubmit=async e=>{e.preventDefault();let f=e.target,n=cents(f.elements.amount.value);if(n<=0||!Number.isSafeInteger(n))return;state.recurrences.push({id:uid(),name:f.elements.name.value.trim(),amount:n,type:f.elements.type.value,frequency:f.elements.frequency.value,account:f.elements.account.value,category:f.elements.category.value,next:f.elements.next.value,anchorDay:Number(f.elements.next.value.slice(8,10)),anchorMonth:Number(f.elements.next.value.slice(5,7))});await processRecurring();render()};document.getElementById('restore').onchange=restore}
window.renameAccount=async id=>{let a=acc(id),n=prompt('Nome del conto',a.name);if(n?.trim()){a.name=n.trim();await save();render()}};window.archiveAccount=async id=>{let a=acc(id);a.archived=!a.archived;await save();render()};window.delRec=async id=>{if(confirm('Interrompere questa ricorrenza? I movimenti già registrati resteranno.')){state.recurrences=state.recurrences.filter(r=>r.id!==id);await save();render()}};
function nextDate(r){let [y,m,d]=r.next.split('-').map(Number),dt=new Date(Date.UTC(y,m-1,d));if(r.frequency==='daily')dt.setUTCDate(dt.getUTCDate()+1);if(r.frequency==='weekly')dt.setUTCDate(dt.getUTCDate()+7);if(r.frequency==='monthly'){let mm=m+1,yy=y;if(mm>12){mm=1;yy++}let last=new Date(Date.UTC(yy,mm,0)).getUTCDate();dt=new Date(Date.UTC(yy,mm-1,Math.min(r.anchorDay||d,last)))}if(r.frequency==='yearly'){let yy=y+1,mm=r.anchorMonth||m,last=new Date(Date.UTC(yy,mm,0)).getUTCDate();dt=new Date(Date.UTC(yy,mm-1,Math.min(r.anchorDay||d,last)))}return dt.toISOString().slice(0,10)}async function processRecurring(){let changed=false,limit=0;for(let r of state.recurrences){while(r.next<=today()&&limit<10000){if(!state.transactions.some(t=>t.recurrence===r.id&&t.date===r.next)){state.transactions.push({id:uid(),created:new Date().toISOString(),type:r.type,amount:r.amount,account:r.account,category:r.category,note:r.name,date:r.next,recurrence:r.id});changed=true}r.next=nextDate(r);changed=true;limit++}}if(changed)await save();if(limit>=10000)document.getElementById('notice').innerHTML='<div class="notice">Troppe scadenze arretrate: alcune ricorrenze richiedono una verifica.</div>'}
function download(name,body,type){let url=URL.createObjectURL(new Blob([body],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}window.backup=()=>download('moneytrack-backup-'+today()+'.json',JSON.stringify(state,null,2),'application/json');window.csv=()=>{let rows=[['Data','Tipo','Importo EUR','Conto','Destinazione','Categoria','Descrizione'],...sortedTx().map(t=>[t.date,t.type,(t.amount/100).toFixed(2),acc(t.account)?.name||'',acc(t.to)?.name||'',t.category,t.note])];download('moneytrack-movimenti-'+today()+'.csv','\ufeff'+rows.map(row=>row.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8')};async function restore(e){let file=e.target.files[0];if(!file)return;try{let data=JSON.parse(await file.text());if(data.version!==1||!Array.isArray(data.accounts)||!Array.isArray(data.transactions)||!Array.isArray(data.recurrences)||!Array.isArray(data.goals)||!Array.isArray(data.categories))throw Error('Formato backup non valido');if(!confirm('Sostituire tutti i dati attuali con quelli del backup?'))return;state=data;await save();await processRecurring();render();alert('Backup ripristinato')}catch(err){alert('Ripristino non riuscito: '+err.message)}}
(async()=>{try{db=await openDB();state=await getData()||init();await processRecurring();render()}catch(e){document.querySelector('.app').innerHTML='<div class="panel">Impossibile aprire il database locale. Controlla che il browser consenta IndexedDB.</div>';console.error(e)}})();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(console.warn);
</script></body></html>
