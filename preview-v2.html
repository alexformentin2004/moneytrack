function savings(){document.getElementById('savings').innerHTML=`<div class="mt-page-title"><h1>Risparmio</h1></div><div class="mt-savings-hero"><span>Totale obiettivi accantonato</span><strong>${euro(state.goals.reduce((n,g)=>n+g.saved,0))}</strong><small>Somma degli importi assegnati ai tuoi obiettivi</small></div><h2>I tuoi obiettivi</h2><div class="notice">Gli obiettivi sono promemoria: il denaro resta contabilizzato nei conti, evitando doppi conteggi.</div><details class="panel mt-goal-form"><summary>+ Crea nuovo obiettivo</summary><h2>Nuovo obiettivo</h2><form id="goalForm"><label>Nome obiettivo</label><input name="name" required maxlength="70" placeholder="Es. Fondo emergenze"><div class="grid"><div><label>Importo obiettivo (€)</label><input name="target" type="number" step="0.01" min="0.01" required></div><div><label>Importo già accantonato (€)</label><input name="saved" type="number" step="0.01" min="0" value="0" required></div></div><button class="primary">+ Crea obiettivo</button></form></details><div class="mt-goals">${state.goals.map(g=>`<div class="mt-goal-card"><div style="flex:1"><b>${esc(g.name)}</b><small>${euro(g.saved)} di ${euro(g.target)} · ${Math.min(100,Math.round(100*g.saved/g.target))}%</small><div class="bar"><div style="width:${Math.min(100,100*g.saved/g.target)}%"></div></div><div class="actions" style="justify-content:flex-start"><button class="secondary" onclick="addGoal('${g.id}')">Aggiorna importo</button><button class="danger" onclick="delGoal('${g.id}')">Elimina</button></div></div></div>`).join('')||'<div class="empty">Crea il tuo primo obiettivo.</div>'}</div>`;document.getElementById('goalForm').onsubmit=async e=>{e.preventDefault();let f=e.target,t=cents(f.elements.target.value),s=cents(f.elements.saved.value);if(t<=0||s<0)return;state.goals.push({id:uid(),name:f.elements.name.value.trim(),target:t,saved:s});await save();render()}}window.addGoal=async id=>{let g=state.goals.find(x=>x.id===id),v=prompt('Nuovo importo accantonato (€)',(g.saved/100).toFixed(2));if(v===null)return;let n=cents(v);if(!Number.isSafeInteger(n)||n<0)return alert('Importo non valido');g.saved=n;await save();render()};window.delGoal=async id=>{if(confirm('Eliminare obiettivo?')){state.goals=state.goals.filter(x=>x.id!==id);await save();render()}};
function accountsPage(){let accounts=state.accounts.filter(a=>!a.archived);document.getElementById('accounts').innerHTML=`<div class="mt-page-title"><h1>I tuoi conti</h1><button onclick="setTab('settings')">＋</button></div><div class="mt-account-list">${accounts.map((a,i)=>`<div class="mt-account-card mt-card-${i%3}"><div class="mt-card-top"><span class="mt-card-icon">${i===0?'▣':'◈'}</span><span>${esc(a.type)}</span></div><span>${esc(a.name)}</span><strong>${euro(balanceOf(a.id))}</strong></div>`).join('')||'<div class="empty">Nessun conto attivo.</div>'}</div><div class="mt-accounts-total"><span>Totale conti</span><strong>${euro(total())}</strong></div><div class="mt-page-title"><h2>Movimenti recenti</h2><button onclick="setTab('movements')">Vedi tutti</button></div><div class="panel mt-movements-panel">${sortedTx().slice(0,4).map(txRow).join('')||'<div class="empty">Nessun movimento.</div>'}</div>`}
function settings(){document.getElementById('settings').innerHTML=`<h2>Conti e impostazioni</h2><div class="panel"><h2>Nuovo conto</h2><form id="accountForm"><div class="grid"><div><label>Nome</label><input name="name" required maxlength="60" placeholder="Conto principale"></div><div><label>Tipologia</label><select name="type"><option>Conto corrente</option><option>Contanti</option><option>Risparmio</option><option>Carta prepagata</option><option>Altro</option></select></div><div class="wide"><label>Saldo iniziale (€)</label><input name="opening" type="number" step="0.01" value="0" required></div></div><button class="primary">+ Aggiungi conto</button></form><div class="sectionhead"><h2>Conti esistenti</h2></div>${state.accounts.map(a=>`<div class="item"><div><b>${esc(a.name)}</b><small>${esc(a.type)} · ${a.archived?'Archiviato':'Attivo'}</small></div><div class="right"><b>${euro(balanceOf(a.id))}</b><div class="actions"><button class="secondary" onclick="renameAccount('${a.id}')">Rinomina</button><button class="secondary" onclick="archiveAccount('${a.id}')">${a.archived?'Riattiva':'Archivia'}</button></div></div></div>`).join('')}</div><div class="panel"><h2>Movimenti ricorrenti</h2><p class="muted mini">Generazione automatica all'apertura dell'app per tutte le scadenze maturate. Puoi interrompere una ricorrenza in qualsiasi momento.</p><form id="recForm"><div class="grid"><div><label>Descrizione</label><input name="name" required placeholder="Es. Abbonamento"></div><div><label>Importo (€)</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div><label>Tipo</label><select name="type"><option value="expense">Spesa</option><option value="income">Entrata</option></select></div><div><label>Frequenza</label><select name="frequency"><option value="monthly">Mensile</option><option value="weekly">Settimanale</option><option value="yearly">Annuale</option><option value="daily">Giornaliera</option></select></div><div><label>Conto</label><select name="account">${accountOpts(state.accounts.find(a=>!a.archived)?.id)}</select></div><div><label>Categoria</label><select name="category">${categoryOpts('Abbonamenti')}</select></div><div><label>Prima scadenza</label><input name="next" type="date" value="${today()}" required></div></div><button class="primary" ${state.accounts.filter(a=>!a.archived).length?'':'disabled'}>+ Aggiungi ricorrenza</button></form>${state.recurrences.map(r=>`<div class="item"><div><b>${esc(r.name)}</b><small>${esc(r.frequency)} · prossima ${dateFmt(r.next)} · ${esc(acc(r.account)?.name||'')}</small></div><div class="right"><b>${euro(r.amount)}</b><div class="actions"><button class="danger" onclick="delRec('${r.id}')">Interrompi</button></div></div></div>`).join('')}</div><div class="panel"><h2>Backup e ripristino</h2><p class="muted mini">I dati restano in questo browser. Esporta periodicamente un backup JSON e conservalo in modo sicuro: non è cifrato.</p><button class="primary" onclick="backup()">↓ Esporta backup JSON</button> <button class="secondary" onclick="csv()">↓ Esporta CSV</button><label>Ripristina da backup JSON (sostituisce tutti i dati)</label><input type="file" accept="application/json,.json" id="restore"><p class="muted mini">Il ripristino richiede conferma. Non è possibile annullarlo senza un backup precedente.</p></div>`;document.getElementById('accountForm').onsubmit=async e=>{e.preventDefault();let f=e.target,n=cents(f.elements.opening.value);if(!Number.isSafeInteger(n))return;state.accounts.push({id:uid(),name:f.elements.name.value.trim(),type:f.elements.type.value,opening:n,archived:false});await save();render()};document.getElementById('recForm').onsubmit=async e=>{e.preventDefault();let f=e.target,n=cents(f.elements.amount.value);if(n<=0||!Number.isSafeInteger(n))return;state.recurrences.push({id:uid(),name:f.elements.name.value.trim(),amount:n,type:f.elements.type.value,frequency:f.elements.frequency.value,account:f.elements.account.value,category:f.elements.category.value,next:f.elements.next.value,anchorDay:Number(f.elements.next.value.slice(8,10)),anchorMonth:Number(f.elements.next.value.slice(5,7))});await processRecurring();render()};document.getElementById('restore').onchange=restore}
window.renameAccount=async id=>{let a=acc(id),n=prompt('Nome del conto',a.name);if(n?.trim()){a.name=n.trim();await save();render()}};window.archiveAccount=async id=>{let a=acc(id);a.archived=!a.archived;await save();render()};window.delRec=async id=>{if(confirm('Interrompere questa ricorrenza? I movimenti già registrati resteranno.')){state.recurrences=state.recurrences.filter(r=>r.id!==id);await save();render()}};
function nextDate(r){let [y,m,d]=r.next.split('-').map(Number),dt=new Date(Date.UTC(y,m-1,d));if(r.frequency==='daily')dt.setUTCDate(dt.getUTCDate()+1);if(r.frequency==='weekly')dt.setUTCDate(dt.getUTCDate()+7);if(r.frequency==='monthly'){let mm=m+1,yy=y;if(mm>12){mm=1;yy++}let last=new Date(Date.UTC(yy,mm,0)).getUTCDate();dt=new Date(Date.UTC(yy,mm-1,Math.min(r.anchorDay||d,last)))}if(r.frequency==='yearly'){let yy=y+1,mm=r.anchorMonth||m,last=new Date(Date.UTC(yy,mm,0)).getUTCDate();dt=new Date(Date.UTC(yy,mm-1,Math.min(r.anchorDay||d,last)))}return dt.toISOString().slice(0,10)}async function processRecurring(){let changed=false,limit=0;for(let r of state.recurrences){while(r.next<=today()&&limit<10000){if(!state.transactions.some(t=>t.recurrence===r.id&&t.date===r.next)){state.transactions.push({id:uid(),created:new Date().toISOString(),type:r.type,amount:r.amount,account:r.account,category:r.category,note:r.name,date:r.next,recurrence:r.id});changed=true}r.next=nextDate(r);changed=true;limit++}}if(changed)await save();if(limit>=10000)document.getElementById('notice').innerHTML='<div class="notice">Troppe scadenze arretrate: alcune ricorrenze richiedono una verifica.</div>'}
function download(name,body,type){let url=URL.createObjectURL(new Blob([body],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}window.backup=()=>download('moneytrack-backup-'+today()+'.json',JSON.stringify(state,null,2),'application/json');window.csv=()=>{let rows=[['Data','Tipo','Importo EUR','Conto','Destinazione','Categoria','Descrizione'],...sortedTx().map(t=>[t.date,t.type,(t.amount/100).toFixed(2),acc(t.account)?.name||'',acc(t.to)?.name||'',t.category,t.note])];download('moneytrack-movimenti-'+today()+'.csv','\ufeff'+rows.map(row=>row.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8')};async function restore(e){let file=e.target.files[0];if(!file)return;try{let data=JSON.parse(await file.text());if(data.version!==1||!Array.isArray(data.accounts)||!Array.isArray(data.transactions)||!Array.isArray(data.recurrences)||!Array.isArray(data.goals)||!Array.isArray(data.categories))throw Error('Formato backup non valido');if(!confirm('Sostituire tutti i dati attuali con quelli del backup?'))return;state=data;await save();await processRecurring();render();alert('Backup ripristinato')}catch(err){alert('Ripristino non riuscito: '+err.message)}}
(async()=>{try{db=await openDB();let previewData=await getData();if(!previewData){try{let source=await new Promise((resolve,reject)=>{let req=indexedDB.open('moneytrack-v1');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});previewData=await new Promise(resolve=>{let req=source.transaction('app').objectStore('app').get('data');req.onsuccess=()=>resolve(req.result);req.onerror=()=>resolve(null)});source.close()}catch(e){console.warn('Preview data copy unavailable',e)}}state=previewData||init();await processRecurring();render()}catch(e){document.querySelector('.app').innerHTML='<div class="panel">Impossibile aprire il database locale. Controlla che il browser consenta IndexedDB.</div>';console.error(e)}})();
</script></body></html>
